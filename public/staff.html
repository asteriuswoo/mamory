<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbf3e6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MAMORY" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png?v=4" />
<link rel="icon" href="icons/icon-192.png?v=4" />
<title>자재 발주 담기 - MAMORY</title>
<link rel="stylesheet" href="css/style.css?v=30" />
</head>
<body class="has-bottom-tabs">
<header class="topbar">
  <div class="brandrow">
    <div>
      <h1><span class="store">MAMORY</span></h1>
      <div class="header-meta">
        <span class="app-tagline">INVENTORY · REQUEST · ORDER · SHARE</span>
        <span class="sub" id="dateLabel"></span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <div class="row-between">
      <div>
        <div id="accountName">-</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="logout-btn" id="refreshBtn">새로고침</button>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>
    </div>
    <a href="owner.html" id="backToOwnerBtn" class="btn secondary block" style="margin-top:10px; display:none;">사장님 계정으로 변경</a>
    <button id="deleteAccountBtn" style="margin-top:10px; background:none; border:none; padding:0; font-size:11.5px; color:var(--muted); text-decoration:underline; text-underline-offset:2px;">계정탈퇴하기</button>
  </div>

  <div class="card">
    <div class="row-between">
      <div style="font-size:13px; color:var(--muted)">알림을 설정하려면 탭하세요</div>
      <button class="btn secondary" id="notifyBtn" style="padding:8px 14px; font-size:12px; white-space:nowrap;">알림 설정하려면 선택하세요</button>
    </div>
  </div>

  <div id="screen">
    <div class="big-cat-grid">
      <button class="big-cat-card" data-main="기본자재">
        <div class="big-cat-title-row">
          <span class="label">기본자재</span>
          <span class="arrow">›</span>
        </div>
        <div class="desc">컵, 뚜껑, 빨대, 감열지, 냅킨, 원두, 기타</div>
      </button>
      <button class="big-cat-card" data-main="식자재">
        <div class="big-cat-title-row">
          <span class="label">식자재</span>
          <span class="arrow">›</span>
        </div>
        <div class="desc">파우더, 시럽/소스, 베이스, 디저트, 냉동, 탄산</div>
      </button>
    </div>
  </div>
</main>

<nav class="bottom-tabs">
  <button class="bottom-tab" data-nav="share">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <span class="corner-badge" id="shareNavBadge" style="display:none;"></span>
    </span>
    <span>공유하기</span>
  </button>
  <button class="bottom-tab active" data-nav="main">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    </span>
    <span>자재선택</span>
  </button>
  <button class="bottom-tab" data-nav="cart">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
      <span class="corner-badge" id="cartNavBadge" style="display:none;"></span>
    </span>
    <span>담은 목록</span>
  </button>
</nav>

<script type="module" src="js/staff.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
