<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fbf3e6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MAMORY" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png?v=4" />
<link rel="icon" href="icons/icon-192.png?v=4" />
<title>자재 발주 담기 - MAMORY</title>
<style>html,body{background:#efece4}</style>
<link rel="stylesheet" href="css/style.css?v=134" />
</head>
<body class="has-bottom-tabs">
<header class="topbar">
  <div class="brandrow">
    <div>
      <h1><span class="store">MAMORY</span></h1>
      <div class="header-meta">
        <span class="app-tagline">INVENTORY · REQUEST · ORDER · SHARE</span>
        <span class="sub" id="dateLabel"></span>
      </div>
    </div>
  </div>
</header>
<div id="musicBarRoot"></div>

<main>
  <div id="monthEndBanner" class="payroll-payday-banner" style="display:none;">📅 다음달 근무등록을 스케줄탭에 해주세요!</div>

  <div class="card" id="profileCard">
    <div class="row-between">
      <div>
        <div id="accountName">-</div>
      </div>
      <div style="display:flex; gap:8px;">
        <span class="notify-bell-wrap">
          <button class="notify-icon-btn" id="notifyBtn" aria-label="알림">🔔</button>
          <span class="notify-badge" id="notifyBadge" style="display:none;"></span>
        </span>
        <button class="logout-btn" id="refreshBtn">새로고침</button>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>
    </div>
    <div id="clockWidgetRoot" style="margin-top:10px;"></div>
    <a href="owner.html" id="backToOwnerBtn" class="btn secondary block" style="margin-top:10px; display:none;">사장님 계정으로 변경</a>
    <div style="margin-top:10px; display:flex; justify-content:space-between;">
      <button id="deleteAccountBtn" style="background:none; border:none; padding:0; font-size:11.5px; color:var(--muted); text-decoration:underline; text-underline-offset:2px;">계정탈퇴하기</button>
      <a href="https://open.kakao.com/o/smPrleSi" target="_blank" rel="noopener" style="font-size:11.5px; color:var(--muted); text-decoration:underline; text-underline-offset:2px;">문의하기 / 버그 신고</a>
    </div>
  </div>

  <div id="screen">
    <div class="big-cat-grid">
      <button class="big-cat-card" data-main="기본자재">
        <div class="big-cat-title-row">
          <span class="label">기본자재</span>
          <span class="arrow">›</span>
        </div>
        <div class="desc">컵, 뚜껑, 빨대, 감열지, 냅킨, 원두, 기타</div>
      </button>
      <button class="big-cat-card" data-main="식자재">
        <div class="big-cat-title-row">
          <span class="label">식자재</span>
          <span class="arrow">›</span>
        </div>
        <div class="desc">파우더, 시럽/소스, 베이스, 디저트, 냉동, 탄산</div>
      </button>
    </div>
  </div>

  <button type="button" class="btn humanity-trigger-btn block humanity-banner-btn" id="humanityBtn">😠 오늘 극한직업 느꼈다면 😠</button>
</main>

<div id="humanityOverlayRoot"></div>
<div id="onboardingOverlayRoot"></div>
<div id="searchFullscreenRoot"></div>

<nav class="bottom-tabs">
  <button class="bottom-tab" data-nav="share">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <span class="corner-badge" id="shareNavBadge" style="display:none;"></span>
    </span>
    <span>공유하기</span>
  </button>
  <button class="bottom-tab" data-nav="register">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>
      <span class="corner-badge" id="registerNavBadge" style="display:none;"></span>
    </span>
    <span>등록해요</span>
  </button>
  <button class="bottom-tab active" data-nav="main">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    </span>
    <span>자재선택</span>
  </button>
  <button class="bottom-tab" data-nav="cart">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
      <span class="corner-badge" id="cartNavBadge" style="display:none;"></span>
    </span>
    <span>담은 목록</span>
  </button>
  <button class="bottom-tab" data-nav="payroll">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M9 16l2 2 4-4"></path></svg>
    </span>
    <span>출근기록</span>
  </button>
</nav>

<script>
// staff.js는 모듈이라 로드/실행이 살짝 늦다 — 그 사이에 이 파일에 그대로
// 박혀있는 기본 탭(자재선택) 마크업이 한 프레임 먼저 그려져서, 새로고침할
// 때마다 다른 탭에 있었어도 자재선택이 잠깐 스쳐 지나갔다. 주소창의
// ?view=를 여기서 동기적으로 먼저 읽어 화면이 그려지기 전에 바로잡는다.
// staff.js의 render()가 실제로 그 탭을 그리는 순간 #screen의 숨김은 풀린다.
(function () {
  var v = new URLSearchParams(location.search).get("view");
  if (!v || v === "main") return;
  var screen = document.getElementById("screen");
  if (screen) screen.style.display = "none";
  var profileCard = document.getElementById("profileCard");
  if (profileCard) profileCard.style.display = "none";
  var monthEndBanner = document.getElementById("monthEndBanner");
  if (monthEndBanner) monthEndBanner.style.display = "none";
  var humanityBtn = document.getElementById("humanityBtn");
  if (humanityBtn) humanityBtn.style.display = "none";
  document.querySelectorAll(".bottom-tab[data-nav]").forEach(function (el) {
    el.classList.toggle("active", el.dataset.nav === v);
  });
})();
</script>
<script type="module" src="js/staff.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
