<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbf3e6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MAMMORY" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png?v=3" />
<link rel="icon" href="icons/icon-192.png?v=3" />
<title>자재 관리 - MAMMORY</title>
<link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body class="has-bottom-tabs">
<header class="topbar">
  <div class="brandrow">
    <div>
      <h1><span class="store">MAMMORY</span></h1>
      <div class="header-meta">
        <span class="app-tagline">Inventory System for MAMMOTH</span>
        <span class="sub" id="pageSub">자재 카탈로그 관리</span>
      </div>
    </div>
  </div>
</header>

<main id="mainContent">
  <div class="card">
    <div class="row-between">
      <div>
        <div id="accountName">-</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="logout-btn" id="refreshBtn">새로고침</button>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row-between">
      <div>
        <div style="font-size:14px; font-weight:700;">직원 가입 코드</div>
        <div style="font-size:12px; color:var(--muted); margin-top:2px;">새로 가입하는 직원/사장님만 이 코드를 입력해야 계정을 만들 수 있어요</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input type="text" id="accessCodeField" placeholder="아직 설정 안 됨" style="flex:1;" />
      <button class="btn gold" id="accessCodeSaveBtn" style="white-space:nowrap;">저장</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size:14px; font-weight:700; margin-bottom:2px;">직원 관리</div>
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">그만둔 직원의 계정을 삭제할 수 있어요</div>
    <div id="staffAccountList"></div>
  </div>

  <div class="card">
    <div class="field">
      <label>대분류</label>
      <div class="seg" id="mainCatSeg">
        <button type="button" class="active" data-val="기본자재">기본자재</button>
        <button type="button" data-val="식자재">식자재</button>
      </div>
    </div>
    <div class="field">
      <label for="newSub">소분류 (기존 것을 아래에서 고르거나, 새 이름을 입력하면 새 소분류가 만들어져요)</label>
      <input type="text" id="newSub" placeholder="예: 컵, 뚜껑, 시럽, 소스 ..." list="subCategoryList" />
      <datalist id="subCategoryList"></datalist>
      <div class="subcat-chip-row" id="existingSubChips"></div>
    </div>
    <div class="field">
      <label for="newName">자재 이름</label>
      <input type="text" id="newName" placeholder="예: 아이스컵 (12oz)" />
    </div>
    <button class="btn gold block" id="addBtn">+ 자재 추가</button>
  </div>

  <div class="card" id="seedCard">
    <div style="font-size:13px; color:var(--muted)">자재가 하나도 없다면, 매머드 익스프레스 커피에서 쓰는 기본 카탈로그를 한 번에 불러올 수 있어요.</div>
    <button class="btn secondary block" id="seedBtn" style="margin-top:10px">기본 자재 목록 불러오기</button>
  </div>

  <div class="maincat-tabs">
    <button class="active" data-cat="기본자재" id="tabBasic">기본자재</button>
    <button data-cat="식자재" id="tabFood">식자재</button>
  </div>

  <div class="card" id="subcatOrderCard" style="display:none;">
    <div style="font-size:14px; font-weight:700; margin-bottom:2px;">소분류 순서</div>
    <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">자주 주문하는 소분류를 위로 옮겨두면 직원/사장 화면 모두에 그 순서로 표시돼요</div>
    <div id="subcatOrderList"></div>
  </div>

  <div id="materialAdminList"></div>
</main>

<nav class="bottom-tabs">
  <a href="share.html" class="bottom-tab">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <span class="corner-badge" id="shareNavBadge" style="display:none;"></span>
    </span>
    <span>공유하기</span>
  </a>
  <a href="owner.html" class="bottom-tab">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
    </span>
    <span>오늘 발주</span>
  </a>
  <a href="admin.html" class="bottom-tab active">
    <span class="bottom-tab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
    </span>
    <span>자재 관리</span>
  </a>
</nav>

<script type="module" src="js/app-shell.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
